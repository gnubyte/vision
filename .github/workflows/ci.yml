name: CI

# Build and test every branch push and pull request on the same runner the
# release uses (macos-15, its default Xcode), then assemble the app and DMG as
# a packaging smoke test. Nothing is published. Version tags (v*) are left to
# release.yml: a push filtered on branches never runs for a tag.
#
# No .build cache: the package has no dependencies, and a fresh checkout gives
# every source a new timestamp, so SwiftPM would rebuild everything anyway.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch or pull request cancels the older run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Build tests
        run: swift build --build-tests

      - name: Run tests
        run: swift test --skip-build

      - name: Package smoke (bundle.sh release)
        run: |
          set -euo pipefail
          bash bundle.sh release
          app="$(find build -maxdepth 1 -name '*.app' -type d | head -n 1)"
          [ -n "$app" ] || { echo "no app bundle in build/" >&2; exit 1; }
          plutil -lint "$app/Contents/Info.plist"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          [ -x "$app/Contents/MacOS/$exe" ] || { echo "missing executable $exe" >&2; exit 1; }
          codesign --verify --deep "$app"
          ls -lh build/*.dmg

      # The app's own snapshot mode opens the real window over a made-up workspace and saves a picture of each
      # scene. Kept as an artifact; a commit whose message says [print-screens] also prints small copies in the log.
      - name: Screens (snapshot mode)
        continue-on-error: true
        env:
          PRINT_SCREENS: ${{ contains(github.event.head_commit.message, '[print-screens]') && '1' || '0' }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/vision-screens"
          build/Vision.app/Contents/MacOS/Vision --snapshot "$out" --snapshot-scenes chat,code,code-agent,prompt-history || true
          cat "$out/snapshot.log" 2>/dev/null || echo "no snapshot log"
          mkdir -p build/screens
          cp "$out"/*.png build/screens/ 2>/dev/null || true
          if [ "$PRINT_SCREENS" = "1" ]; then
            for f in build/screens/*.png; do
              [ -f "$f" ] || continue
              sips -Z 1000 -s format jpeg -s formatOptions 35 "$f" --out "$f.small.jpg" >/dev/null
              echo "SHOT $(basename "$f" .png)"
              base64 -i "$f.small.jpg" | fold -w 160
              echo "END SHOT"
              rm -f "$f.small.jpg"
            done
          fi

      - name: Keep the screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vision-macOS-screens
          path: build/screens/*.png
          if-no-files-found: ignore
